<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="/assets/img/lit-favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <title>Document Assembly Line: community meetings</title>
</head>
<body>
	<header class="header">
		<h1>
			<div class="subtitle">Document Assembly Line</div>
			<div class="title">Community meetings</div>
		</h1>
		<div class="timeZone">
			<label class="timeZoneNotice" for="timeZoneSelect">Time zone</label>
			<select id="timeZoneSelect" class="timeZone"></select>
		</div>
	</header>
	<main id="schedule" class="schedule">
		<div class="dayContainer">
			<div class="dayHeader">Monday</div>
			<div id="Monday" class="day"></div>
		</div>
		<div class="dayContainer">
			<div class="dayHeader">Tuesday</div>
			<div id="Tuesday" class="day"></div>
		</div>
		<div class="dayContainer">
			<div class="dayHeader">Wednesday</div>
			<div id="Wednesday" class="day"></div>
		</div>
		<div class="dayContainer">
			<div class="dayHeader">Thursday</div>
			<div id="Thursday" class="day"></div>
		</div>
		<div class="dayContainer">
			<div class="dayHeader">Friday</div>
			<div id="Friday" class="day"></div>
		</div>
	</main>
  <script type="text/javascript" src="/assets/js/main.js"></script>
</body>
</html>
